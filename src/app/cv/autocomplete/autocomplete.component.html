<div class="search-box position-relative">
  <input type="text" class="form-control" placeholder="Rechercher un CV par nom" [value]="query()"
    (input)="onSearchInput($event)" />

  @if (isOpen() && (results.isLoading() || results.error() || results.value().length)) {
  <div class="search-dropdown list-group shadow">
    @if (results.isLoading()) {
    <div class="list-group-item text-muted">Recherche en cours…</div>
    }
    @for (cv of results.value(); track cv.id) {
    <div class="list-group-item list-group-item-action">
      <app-item [cv]="cv" [disabled]="cv.id === selectedCv()?.id" (selectCv)="closeDropdown()"></app-item>
    </div>
    }
  </div>
  }
</div>
