<form [formGroup]="form">
  <input type="text" class="form-control" formControlName="search" />
</form>
@if (results().length) {
  <ul class="list-group mt-2">
    @for (cv of results(); track cv.id) {
      <li class="list-group-item">
        <app-item [cv]="cv"></app-item>
      </li>
    }
  </ul>
}
