<div class="row">
  <div class="col">
    <div class="alert alert-warning">
      {{ date | date : "full" | uppercase }}
    </div>
    <app-autocomplete></app-autocomplete>
    <app-list [cvs]="cvs.value()" [selectedCv]="selectedCv()"></app-list>
  </div>
  <div class="col">
    <app-cv-card [cv]="selectedCv()"></app-cv-card>
  </div>
</div>
<!--
  when hasEmbauchees() : the list is empty until someone is hired -> don't load it before.
  prefetch on idle     : download the chunk when the browser is idle, so it renders instantly.
-->
@defer (when hasEmbauchees(); prefetch on idle) {
  <app-embauche></app-embauche>
} @loading (minimum 300ms) {
  <div class="alert alert-light mt-2">Chargement des embauchés...</div>
}
